<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>{% block title %}Система аренды жилья{% endblock %}</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/normalize/8.0.1/normalize.css">
    {% load static %}
    <link rel="stylesheet" href="{% static 'styles.css' %}">
    <style>
        body { font-family: Arial, sans-serif; margin: 20px; }
        nav { margin-bottom: 20px; }
        nav a { margin-right: 15px; text-decoration: none; color: #333; }
        .container { max-width: 800px; margin: 0 auto; }
        .errorlist { color: red; }
    </style>
</head>
<body>
    <nav>
        <a href="{% url 'home' %}">Главная</a>
        <a href="{% url 'listing-list' %}">Объявления</a>
        <a href="{% url 'listing-search' %}">Поиск</a>
        {% if user.is_authenticated%}
        <a href="{% url 'booking-list' %}">Бронирования</a>
        <!-- <a href="{% url 'review-list' %}">Отзывы</a> -->
        {% endif %}
        {% if user.is_authenticated %}
            <span style="margin-left: 30px;">Привет, {{ user.username }}! Ты {{user.role}}</span>
            <a href="{% url 'profile' %}">Профиль</a>
            <form method="post" action="{% url 'logout' %}" style="display: inline;">
                {% csrf_token %}
                <button type="submit">Выход</button>
            </form>            
        {% else %}
            <a href="{% url 'login' %}" style="margin-left: 30px;">Войти</a>
        {% endif %}
    </nav>
    <hr>
    <div class="container">
        {% block content %}
        {% endblock content %}
    </div>
</body>
<a href="{% url 'debug-request' %}">DEBUG</a>
</html>
