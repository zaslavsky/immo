{% extends "base.html" %}

{% block title %}Удаление объявления{% endblock %}

{% block content %}
<h1>Удаление объявления</h1>
<p>Вы уверены, что хотите удалить объявление "{{ listing.title }}"?</p>
<form method="post">
    {% csrf_token %}
    <button type="submit">Подтвердить удаление</button>
    <a href="{% url 'listing-detail' listing.pk %}">Отмена</a>
</form>
{% endblock content %}
